<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Confirm your email</title>
	</head>
	<body style="margin:0; padding:0; background-color:#f6f7fb; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f7fb; padding:24px 12px;">
			<tr>
				<td align="center">
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background:#ffffff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden;">
						<tr>
							<td style="padding:24px 24px 8px 24px;">
								<h1 style="margin:0; font-size:24px; line-height:1.3; color:#111827;">Welcome to Petal Pixel Studio</h1>
							</td>
						</tr>
						<tr>
							<td style="padding:8px 24px 0 24px; font-size:16px; line-height:1.6; color:#374151;">
								Please confirm your email to activate your account and continue.
							</td>
						</tr>
						<tr>
							<td align="center" style="padding:24px;">
								<a
									href="{{ .ConfirmationURL }}"
									style="display:inline-block; padding:12px 20px; background:#111827; color:#ffffff; text-decoration:none; font-size:15px; font-weight:700; border-radius:8px;"
								>
									Confirm Email
								</a>
							</td>
						</tr>
						<tr>
							<td style="padding:0 24px 8px 24px; font-size:14px; line-height:1.6; color:#6b7280;">
								If the button does not work, open this link in your browser:
							</td>
						</tr>
						<tr>
							<td style="padding:0 24px 20px 24px; font-size:13px; line-height:1.6; word-break:break-all;">
								<a href="{{ .ConfirmationURL }}" style="color:#2563eb; text-decoration:underline;">{{ .ConfirmationURL }}</a>
							</td>
						</tr>
						<tr>
							<td style="padding:0 24px 24px 24px;">
								<div style="background:#f3f4f6; border:1px dashed #d1d5db; border-radius:8px; padding:12px;">
									<p style="margin:0 0 6px 0; font-size:12px; color:#6b7280;">Verification token:</p>
									<p style="margin:0; font-size:18px; letter-spacing:1px; font-weight:700; color:#111827;">{{ .Token }}</p>
								</div>
							</td>
						</tr>
						<tr>
							<td style="padding:0 24px 24px 24px; font-size:12px; line-height:1.6; color:#9ca3af;">
								If you did not request this email, you can safely ignore it.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>

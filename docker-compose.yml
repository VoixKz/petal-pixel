name: petal-pixel

volumes:
  pgdata:
  s3-data:
  contract-data:
  anvil-data:
  keycloak-data:
  go-mod-cache:

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    user: root
    entrypoint: ["/bin/sh", "-c"]
    # --state keeps the chain across restarts, so minted rows in Postgres stay true.
    command: ["anvil --chain-id 1337 --host 0.0.0.0 --state /data/anvil.json --state-interval 5"]
    ports:
      - "8545:8545"
    volumes:
      - anvil-data:/data
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 5s
      retries: 30

  deploy:
    image: ghcr.io/foundry-rs/foundry:stable
    user: root
    entrypoint: ["/bin/sh", "/work/deploy.sh"]
    working_dir: /work/flower-backend
    environment:
      RPC_URL: http://anvil:8545
      CHAIN_ID: "1337"
    volumes:
      - ./flower-backend:/work/flower-backend
      - ./lib:/work/lib
      - ./tools/docker/deploy.sh:/work/deploy.sh:ro
      - contract-data:/shared
    depends_on:
      anvil:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flower
      POSTGRES_PASSWORD: flower
      POSTGRES_DB: flower
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flower -d flower"]
      interval: 2s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    user: root
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens carry this issuer. The backend reaches Keycloak at keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./tools/keycloak/petal-pixel-realm.json:/opt/keycloak/data/import/petal-pixel-realm.json:ro
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  s3:
    # Local S3 server: objects are plain files in the volume. Port 9000 must be
    # published because browsers open token URIs from it.
    image: versity/versitygw:v1.10.0
    command: ["--access", "flower", "--secret", "flowersecret", "--port", ":9000", "posix", "/data"]
    ports:
      - "9000:9000"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./flower-backend
    ports:
      - "50051:50051"
    environment:
      GRPC_ADDR: ":50051"
      DB_DSN: postgresql://flower:flower@postgres:5432/flower?sslmode=disable
      DB_AUTO_MIGRATE: "true"
      CHAIN_ID: "1337"
      RPC_URL: http://anvil:8545
      OIDC_ISSUER: http://localhost:8180/realms/petal-pixel
      OIDC_JWKS_URL: http://keycloak:8080/realms/petal-pixel/protocol/openid-connect/certs
      OIDC_AUDIENCE: petal-pixel
      # Anvil account 1. The key is public, so this is for the local chain only.
      VOUCHER_SIGNER_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      GRPC_WEB_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: flower
      S3_SECRET_KEY: flowersecret
      S3_BUCKET: flower
      # Browser-facing URL for token URIs — must be the host-published S3 port.
      S3_PUBLIC_BASE_URL: http://localhost:9000/flower
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_READ: "true"
    volumes:
      - contract-data:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./petal-pixel-studio
    ports:
      - "8080:8080"
    environment:
      # Browser-resolved URLs -> localhost + published ports.
      VITE_FLOWER_BACKEND_URL: http://localhost:50051
      VITE_CHAIN_ID: "1337"
      VITE_RPC_URL: http://127.0.0.1:8545
      VITE_OIDC_AUTHORITY: http://localhost:8180/realms/petal-pixel
      VITE_OIDC_CLIENT_ID: petal-pixel
      # File-watching on Windows Docker bind mounts needs polling; opt in with CHOKIDAR_USEPOLLING=1 in .env
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-}
    volumes:
      - ./petal-pixel-studio:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  codegen:
    image: bufbuild/buf:1.47.2
    profiles: ["tools"]
    working_dir: /workspace/flower-backend
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        buf generate
        buf generate --template buf.gen.frontend.yaml
        echo "codegen: Go -> gen/go and TS -> ../petal-pixel-studio/src/gen regenerated"
    volumes:
      - .:/workspace
    restart: "no"

  backend-test:
    image: golang:1.25-alpine
    profiles: ["tools"]
    working_dir: /workspace
    command: ["go", "test", "./..."]
    environment:
      CGO_ENABLED: "0"
      TEST_DB_DSN: postgresql://flower:flower@postgres:5432/flower?sslmode=disable
      TEST_S3_ENDPOINT: http://s3:9000
      TEST_S3_ACCESS_KEY: flower
      TEST_S3_SECRET_KEY: flowersecret
    volumes:
      - ./flower-backend:/workspace
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: "no"

  contract-test:
    image: ghcr.io/foundry-rs/foundry:stable
    profiles: ["tools"]
    user: root
    working_dir: /work/flower-backend
    entrypoint: ["forge"]
    command: ["test"]
    volumes:
      - ./flower-backend:/work/flower-backend
      - ./lib:/work/lib
    restart: "no"

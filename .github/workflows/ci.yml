name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flower
          POSTGRES_PASSWORD: flower
          POSTGRES_DB: flower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flower -d flower"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CGO_ENABLED: "0"
      TEST_DB_DSN: postgresql://flower:flower@localhost:5432/flower?sslmode=disable
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY: flower
      TEST_S3_SECRET_KEY: flowersecret
    defaults:
      run:
        working-directory: flower-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: flower-backend/go.mod
          cache-dependency-path: flower-backend/go.sum
      # Not a service: services cannot pass arguments to the container.
      - run: docker run -d -p 9000:9000 versity/versitygw:v1.10.0 --access flower --secret flowersecret --port :9000 posix /tmp
      - run: go vet ./...
      - run: go test ./...

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flower-backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petal-pixel-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petal-pixel-studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Pinned: Playwright 1.58 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petal-pixel-studio/package-lock.json
      - run: npm ci
        working-directory: petal-pixel-studio
      - run: npx playwright install --with-deps chromium
        working-directory: petal-pixel-studio
      - run: docker compose up -d --build
      # Docker accepts the port before Vite listens, so the first tries get a reset.
      - run: curl --silent --fail --retry 60 --retry-delay 2 --retry-all-errors --output /dev/null http://localhost:8080
      - run: npm run test:e2e
        working-directory: petal-pixel-studio
      - run: bash tools/docker/smoke-mint.sh
      - if: failure()
        run: docker compose logs --tail=100

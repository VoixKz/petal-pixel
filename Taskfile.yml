version: "3"

vars:
  ANVIL_URL: "http://127.0.0.1:8545"
  CHAIN_ID: "1337"
  FRONTEND_DIR: "petal-pixel-studio"
  BACKEND_DIR: "flower-backend"
  DEPLOY_SCRIPT: "script/Deploy.s.sol:Deploy"

tasks:
  dev:
    desc: Start anvil, deploy contract, run backend + frontend
    cmds:
      - task: anvil
      - task: deploy
      - task: backend:window
      - task: frontend:window

  anvil:
    desc: Start anvil (separate window)
    cmds:
      - powershell -NoProfile -Command "Start-Process powershell -ArgumentList '-NoProfile','-Command','anvil --chain-id {{.CHAIN_ID}}'"

  deploy:
    desc: Deploy NFT contract and print address
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ".\\tools\\dev\\deploy.ps1" -BackendDir "{{.BACKEND_DIR}}" -RpcUrl "{{.ANVIL_URL}}" -DeployScript "{{.DEPLOY_SCRIPT}}"

  backend:
    desc: Run Go backend (loads env + .task.env)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ".\\tools\\dev\\run-backend.ps1" -BackendDir "{{.BACKEND_DIR}}" -ChainId "{{.CHAIN_ID}}"

  backend:window:
    desc: Run Go backend (separate window)
    cmds:
      - powershell -NoProfile -Command "Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','.\tools\dev\run-backend.ps1','-BackendDir','{{.BACKEND_DIR}}','-ChainId','{{.CHAIN_ID}}'"

  frontend:
    desc: Run Vite frontend
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run dev

  frontend:window:
    desc: Run Vite frontend (separate window)
    cmds:
      - powershell -NoProfile -Command "Start-Process powershell -WorkingDirectory '{{.FRONTEND_DIR}}' -ArgumentList '-NoProfile','-Command','npm run dev'"

  clean:
    desc: Remove task temp env file
    cmds:
      - powershell -NoProfile -Command "if (Test-Path .task.env) { Remove-Item .task.env }"